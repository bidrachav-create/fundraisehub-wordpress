name: Package & Release

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Build plugin ZIPs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate tag vs plugin versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CORE_VERSION=$(grep -m1 'Version:' fundraisehub-core/fundraisehub-core.php | sed 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          ELEMENTOR_VERSION=$(grep -m1 'Version:' fundraisehub-elementor/fundraisehub-elementor.php | sed 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          echo "Tag version:      ${TAG_VERSION}"
          echo "Core version:     ${CORE_VERSION}"
          echo "Elementor version: ${ELEMENTOR_VERSION}"
          if [ "${TAG_VERSION}" != "${CORE_VERSION}" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match fundraisehub-core version (${CORE_VERSION})"
            exit 1
          fi
          if [ "${TAG_VERSION}" != "${ELEMENTOR_VERSION}" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match fundraisehub-elementor version (${ELEMENTOR_VERSION})"
            exit 1
          fi

      - name: Install JS dependencies
        run: npm ci

      - name: Build plugin ZIPs
        run: bash bin/build-zip.sh

      - name: Upload plugin ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fundraisehub-plugin-zips-${{ github.run_id }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download plugin ZIP artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          name: fundraisehub-plugin-zips-${{ github.run_id }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          body: |
            ## FundRaiseHub WordPress Plugins ${{ github.ref_name }}

            ### Installation

            1. Download the ZIP(s) below.
            2. In your WordPress admin go to **Plugins → Add New → Upload Plugin**.
            3. Choose the ZIP file and click **Install Now**, then **Activate**.

            ### Included packages

            | File | Description |
            |---|---|
            | `fundraisehub-core-*.zip` | Core plugin – required. Registers the campaign CPT, Gutenberg blocks, shortcodes, API client and settings page. |
            | `fundraisehub-elementor-*.zip` | Optional Elementor add-on. Requires the Core plugin **and** Elementor to be active. |

            ### Requirements

            - WordPress 6.4+
            - PHP 8.1+
            - Elementor (only for the Elementor add-on ZIP)
          files: dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

  publish-main-build:
    name: Publish main build ZIPs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download plugin ZIP artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          name: fundraisehub-plugin-zips-${{ github.run_id }}
          path: dist

      - name: Publish rolling main build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-latest
          name: Main branch latest build
          prerelease: true
          make_latest: false
          target_commitish: main
          body: |
            Latest ZIP builds from the `main` branch.

            ### Included packages

            - `fundraisehub-core-*.zip`
            - `fundraisehub-elementor-*.zip`

            Tagged `v*` releases remain the stable/public release channel.
          files: dist/*.zip
          fail_on_unmatched_files: true
