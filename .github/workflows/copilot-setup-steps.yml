name: "Copilot Setup Steps"

# Run automatically when this file changes (validates it works), and allow
# manual runs from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be named `copilot-setup-steps` for Copilot to pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      # Install PHP dev dependencies (phpcs, phpunit, wpcs, etc.) before the
      # firewall is enabled so that Composer can reach github.com/packagist.org.
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Install JS dependencies (webpack, @wordpress/scripts, etc.) before the
      # firewall is enabled so that npm can reach the registry.
      - name: Install npm dependencies
        run: npm ci
