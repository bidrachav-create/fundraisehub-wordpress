name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP (phpcs + phpunit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: composer run phpcs

      - name: Run PHPUnit
        run: composer run test

  js:
    name: JavaScript (build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

  js-lint-advisory:
    name: JavaScript/CSS Lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js -- "fundraisehub-core/blocks/**/*.js" "fundraisehub-core/js/**/*.js"

      - name: Lint CSS
        run: npm run lint:css -- --allow-empty-input "fundraisehub-core/blocks/**/*.css" "fundraisehub-core/css/**/*.css"
